name: mamasql

# Easiest way to run MamaSQL: pulls prebuilt images from GitHub Container
# Registry — no source checkout, no build step.
#
#   1. (optional) cp .env.example .env   and edit it
#   2. docker compose up -d
#   3. open http://localhost:5001
#
# To build the images yourself instead, use docker-compose.build.yml.

services:
  # The app: built UI served by nginx, which also proxies /api to the bridge.
  web:
    container_name: mamasql_web
    image: ghcr.io/fizzexual/mamasql-web:${MAMASQL_VERSION:-latest}
    # MamaSQL has no login, and the bridge behind it will connect to any host it
    # is given — so anyone who can reach this port can reach your databases.
    # On a machine that's exposed to a network you don't trust, set BIND_ADDR in
    # .env to a single interface (e.g. 127.0.0.1, or a VPN address).
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${WEB_PORT:-5001}:80"
    depends_on:
      - bridge
    restart: always

  # Opens real PostgreSQL / MySQL connections on the browser's behalf.
  # Reached only through the web container's /api proxy.
  bridge:
    container_name: mamasql_bridge
    image: ghcr.io/fizzexual/mamasql-bridge:${MAMASQL_VERSION:-latest}
    environment:
      BRIDGE_PORT: "5174"
      # SQLite database files live here — a named volume so they persist across
      # restarts and are shared by every browser/tab/port that connects.
      DATA_DIR: "/data"
    volumes:
      - sqlitedata:/data
    expose:
      - "5174"
    # Lets connections use host "host.docker.internal" to reach a database
    # running on your own machine (works on all platforms, incl. Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  # --- Optional demo databases ---------------------------------------------
  # Connect from the app with host "postgres" / "mysql" (port 5432 / 3306).
  # Delete these two services if you only connect to your own databases.
  #
  # These ship with a well-known password, so they are published to localhost
  # only. The app doesn't use these ports — it reaches the databases over the
  # compose network — so this affects nothing but external clients on the host.
  # To attach one (DBeaver, psql, …) from another machine, set DB_BIND_ADDR.
  #
  # NOTE: a published port bypasses ufw/firewalld, which filter the host's INPUT
  # chain while Docker forwards ahead of it. The bind address is enforced by
  # Docker itself, which is why it's set here rather than left to the firewall.
  postgres:
    container_name: mamasql_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-mamasql}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mamasql}
      POSTGRES_DB: ${DB_DATABASE:-demo}
    ports:
      - "${DB_BIND_ADDR:-127.0.0.1}:${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  mysql:
    container_name: mamasql_mysql
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-mamasql}
      MYSQL_DATABASE: ${DB_DATABASE:-demo}
    ports:
      - "${DB_BIND_ADDR:-127.0.0.1}:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    restart: always

volumes:
  pgdata:
  mysqldata:
  sqlitedata:
