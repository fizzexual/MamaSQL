name: mamasql

# Build the images from source (for development or before the published images
# exist). For the easy "just pull prebuilt images" path, use docker-compose.yml.
#
#   docker compose -f docker-compose.build.yml up -d --build

services:
  web:
    container_name: mamasql_web
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    # No login sits in front of this, and the bridge behind it connects to any
    # host it's given — set BIND_ADDR in .env to pin it to one interface.
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${WEB_PORT:-5001}:80"
    depends_on:
      - bridge
    restart: unless-stopped

  bridge:
    container_name: mamasql_bridge
    build:
      context: .
      dockerfile: docker/bridge.Dockerfile
    environment:
      BRIDGE_PORT: "5174"
      DATA_DIR: "/data"
    volumes:
      - sqlitedata:/data
    expose:
      - "5174"
    # Reach a database on your own machine via host "host.docker.internal".
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  postgres:
    container_name: mamasql_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-mamasql}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mamasql}
      POSTGRES_DB: ${DB_DATABASE:-demo}
    # Well-known password — published to localhost only. The app reaches these
    # over the compose network, so this only affects external clients.
    ports:
      - "${DB_BIND_ADDR:-127.0.0.1}:${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  mysql:
    container_name: mamasql_mysql
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-mamasql}
      MYSQL_DATABASE: ${DB_DATABASE:-demo}
    ports:
      - "${DB_BIND_ADDR:-127.0.0.1}:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    restart: unless-stopped

volumes:
  pgdata:
  mysqldata:
  sqlitedata:
